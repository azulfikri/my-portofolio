<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#fef08a"/>
  <defs>
    <pattern id="grid-yellow" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ca8a04" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-yellow)" />
  
  <g transform="translate(250, 80)">
    <rect x="6" y="6" width="300" height="260" fill="#1a1a2e" rx="4"/>
    <rect x="0" y="0" width="300" height="260" fill="#fffbf5" stroke="#1a1a2e" stroke-width="4" rx="4"/>
    
    <!-- Field / Court outline -->
    <rect x="50" y="60" width="200" height="100" fill="#4ade80" stroke="#1a1a2e" stroke-width="3"/>
    <line x1="150" y1="60" x2="150" y2="160" stroke="#ffffff" stroke-width="2"/>
    <circle cx="150" cy="110" r="24" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Calendar slot badge -->
    <rect x="85" y="180" width="130" height="24" fill="#f59e0b" stroke="#1a1a2e" stroke-width="2"/>
    <text x="150" y="196" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SLOT: 19:00 - 21:00</text>

    <!-- Label -->
    <text x="150" y="225" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">BOOKING LAPANGAN</text>
    <text x="150" y="245" font-family="'Space Mono', monospace" font-size="11" fill="#b45309" text-anchor="middle">Laravel + Tailwind + MySQL</text>
  </g>
</svg>
