<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#bae6fd"/>
  <defs>
    <pattern id="grid-blue" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-blue)" />
  
  <g transform="translate(250, 80)">
    <rect x="6" y="6" width="300" height="260" fill="#1a1a2e" rx="4"/>
    <rect x="0" y="0" width="300" height="260" fill="#fffbf5" stroke="#1a1a2e" stroke-width="4" rx="4"/>
    
    <!-- Warehouse Crates / Isometric Boxes -->
    <rect x="100" y="70" width="100" height="80" fill="#fb923c" stroke="#1a1a2e" stroke-width="4"/>
    <line x1="100" y1="110" x2="200" y2="110" stroke="#1a1a2e" stroke-width="3"/>
    <line x1="150" y1="70" x2="150" y2="150" stroke="#1a1a2e" stroke-width="3"/>
    
    <!-- QR / Barcode indicator -->
    <rect x="120" y="85" width="60" height="15" fill="#1a1a2e"/>

    <!-- Status badge -->
    <rect x="105" y="170" width="90" height="22" fill="#10b981" stroke="#1a1a2e" stroke-width="2"/>
    <text x="150" y="185" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">STOK: READY</text>

    <!-- Label -->
    <text x="150" y="225" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">WAREHOUSE SYSTEM</text>
    <text x="150" y="245" font-family="'Space Mono', monospace" font-size="11" fill="#0284c7" text-anchor="middle">Vue.js + Express + Prisma (MSIB)</text>
  </g>
</svg>
