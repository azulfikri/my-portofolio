<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#bbf7d0"/>
  <defs>
    <pattern id="grid-green" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16a34a" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-green)" />
  
  <g transform="translate(250, 80)">
    <rect x="6" y="6" width="300" height="260" fill="#1a1a2e" rx="4"/>
    <rect x="0" y="0" width="300" height="260" fill="#fffbf5" stroke="#1a1a2e" stroke-width="4" rx="4"/>
    
    <!-- Sensor Dials / Metrics -->
    <rect x="40" y="60" width="100" height="60" fill="#ffffff" stroke="#1a1a2e" stroke-width="3"/>
    <text x="90" y="80" font-family="'Space Mono', monospace" font-size="10" fill="#4a4a68" text-anchor="middle">SUHU</text>
    <text x="90" y="105" font-family="'Space Mono', monospace" font-size="18" font-weight="bold" fill="#ea580c" text-anchor="middle">29.4°C</text>

    <rect x="160" y="60" width="100" height="60" fill="#ffffff" stroke="#1a1a2e" stroke-width="3"/>
    <text x="210" y="80" font-family="'Space Mono', monospace" font-size="10" fill="#4a4a68" text-anchor="middle">AMONIA</text>
    <text x="210" y="105" font-family="'Space Mono', monospace" font-size="18" font-weight="bold" fill="#16a34a" text-anchor="middle">12 ppm</text>

    <!-- Signal pulse -->
    <rect x="100" y="145" width="100" height="24" fill="#6366f1" stroke="#1a1a2e" stroke-width="2"/>
    <text x="150" y="161" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">IOT CONNECTED</text>

    <!-- Label -->
    <text x="150" y="215" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e" text-anchor="middle">KANDANG AYAM PETELUR</text>
    <text x="150" y="235" font-family="'Space Mono', monospace" font-size="11" fill="#16a34a" text-anchor="middle">Flutter + Supabase + ESP32</text>
  </g>
</svg>
