<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#fed7aa"/>
  <!-- Neo-brutalism grid background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ea580c" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)" />
  
  <!-- Brutalist Frame -->
  <g transform="translate(250, 80)">
    <rect x="6" y="6" width="300" height="260" fill="#1a1a2e" rx="4"/>
    <rect x="0" y="0" width="300" height="260" fill="#fffbf5" stroke="#1a1a2e" stroke-width="4" rx="4"/>
    
    <!-- Chili / Detection Visual -->
    <circle cx="150" cy="110" r="60" fill="#ea580c" stroke="#1a1a2e" stroke-width="4"/>
    <path d="M 150 50 Q 170 30 190 35" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    
    <!-- YOLO Bounding Box -->
    <rect x="70" y="35" width="160" height="150" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,4"/>
    <rect x="70" y="20" width="105" height="20" fill="#2563eb"/>
    <text x="75" y="34" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff">CABAI: 94.8%</text>

    <!-- Label -->
    <text x="150" y="225" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e" text-anchor="middle">DETEKSI KEMATANGAN CABAI</text>
    <text x="150" y="245" font-family="'Space Mono', monospace" font-size="11" fill="#ea580c" text-anchor="middle">YOLOv8 + FastAPI + Vue.js</text>
  </g>
</svg>
